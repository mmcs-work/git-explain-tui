name: Release

on:
  push:
    tags:
      - "v*"

# Building needs repository access; publishing receives a short-lived OIDC token
# only in the dedicated job below.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The suite module keeps its tests package-relative, so run it as a module.
      - run: uv run python -m unittest tests.test_suite

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/git-explain-tui/
    permissions:
      # PyPI exchanges this job's GitHub identity for a short-lived token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  binaries:
    needs: test
    strategy:
      matrix:
        include:
          # Build separately: PyInstaller executables are tied to their OS/CPU.
          - os: ubuntu-latest
            asset: git-explain-tui-linux-x86_64
          # macos-13 is retired from GitHub's standard Intel runner pool.
          - os: macos-15-intel
            asset: git-explain-tui-macos-x86_64
          - os: macos-14
            asset: git-explain-tui-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build standalone executable
        run: >-
          uv run --with pyinstaller pyinstaller --clean --noconfirm --onefile
          --name ${{ matrix.asset }} --copy-metadata git-explain-tui
          --paths . --collect-all git_explain_tui --collect-all litellm 
          --hidden-import curses
          --hidden-import _curses
          scripts/standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  github-release:
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      # This is deliberately separate from PyPI's OIDC-only publish job.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: git-explain-tui-*
          path: release-assets/
          merge-multiple: true
      - name: Write checksums for the installer
        run: cd release-assets && sha256sum git-explain-tui-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

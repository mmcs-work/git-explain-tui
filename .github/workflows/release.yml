name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run python -m unittest tests.test_suite

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/git-explain-tui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  binaries:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: git-explain-tui-linux-x86_64
          - os: macos-15-intel
            asset: git-explain-tui-macos-x86_64
          - os: macos-14
            asset: git-explain-tui-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build standalone executable
        run: >-
          uv run --with pyinstaller pyinstaller
          --clean
          --noconfirm
          --onefile
          --name ${{ matrix.asset }}
          --copy-metadata git-explain-tui
          --copy-metadata litellm
          --copy-metadata tiktoken
          --paths .
          --collect-all git_explain_tui
          --collect-all litellm
          --collect-all tiktoken
          --collect-all tiktoken_ext
          --hidden-import curses
          --hidden-import _curses
          --hidden-import tiktoken_ext.openai_public
          scripts/standalone.py

      - name: Smoke test executable
        run: |
          chmod +x "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" -v

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  github-release:
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: git-explain-tui-*
          path: release-assets/
          merge-multiple: true

      - name: Write checksums
        run: |
          cd release-assets
          sha256sum git-explain-tui-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
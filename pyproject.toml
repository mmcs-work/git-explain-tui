[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-explain-tui"
version = "0.1.2"
description = "Git commit browser with commit-scoped AI chat"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "GitExplain TUI contributors" }]
keywords = ["ai", "git", "llm", "terminal", "tui"]
dependencies = ["litellm>=1.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
git-explain-tui = "git_explain_tui.__main__:main"

[project.urls]
Homepage = "https://github.com/mmcs-work/git-explain-tui"
Documentation = "https://mmcs-work.github.io/git-explain-tui/"
Source = "https://github.com/mmcs-work/git-explain-tui"
Issues = "https://github.com/mmcs-work/git-explain-tui/issues"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["git_explain_tui*"]
